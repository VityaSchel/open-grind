name: OpenGrindUITests
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  OpenGrindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Driver]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opengrind.uitests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
schemes:
  OpenGrindUITests:
    build:
      targets:
        OpenGrindUITests: [test]
    test:
      targets: [OpenGrindUITests]
