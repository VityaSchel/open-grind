[graph]
all-features = true
targets = [
	"aarch64-linux-android",
	"armv7-linux-androideabi",
	"i686-linux-android",
	"x86_64-linux-android",
	"x86_64-unknown-linux-gnu",
	"aarch64-apple-darwin",
	"x86_64-apple-darwin",
	"x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
# Unmaintained transitive crates are upstream's to replace, not ours.
unmaintained = "workspace"
ignore = [
	{ id = "RUSTSEC-2026-0194", reason = "quick-xml, via plist <- tauri: parses our own bundled Info.plist on macOS, never attacker input, and does not reach the Android APK. Re-check when tauri bumps plist." },
	{ id = "RUSTSEC-2026-0195", reason = "quick-xml, same dependency path and same reasoning as RUSTSEC-2026-0194." },
]

[licenses]
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"MIT-0",
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]

[bans]
# Upstream duplicates (six windows-sys, four rand) are not ours to collapse.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
