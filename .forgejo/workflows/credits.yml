name: credits

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/**
      - "!src/lib/i18n/locales/**"
      - scripts/credits/**
      - scripts/gen-credits.ts
      - package.json
      - bun.lock
      - patches/**
      - scripts/patch-deps.ts
      - svelte.config.js
      - vite.config.mjs
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/patches/**
      - src-tauri/about.toml
      - src-tauri/about.hbs
      - rust-toolchain.toml
      - .forgejo/workflows/credits.yml
  push:
    branches: [main]
    paths:
      - src/**
      - "!src/lib/i18n/locales/**"
      - scripts/credits/**
      - scripts/gen-credits.ts
      - package.json
      - bun.lock
      - patches/**
      - scripts/patch-deps.ts
      - svelte.config.js
      - vite.config.mjs
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/patches/**
      - src-tauri/about.toml
      - src-tauri/about.hbs
      - rust-toolchain.toml
      - .forgejo/workflows/credits.yml
  workflow_dispatch:

concurrency:
  group: open-grind-credits-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  credits:
    runs-on: ["fork", "toolchain", "2c4g", "hetzner"]
    timeout-minutes: 30
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      EXPECTED_SHA: ${{ forgejo.event.pull_request.head.sha }}
      CI_WORKSPACE: /opt/open-grind-credits
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_PROGRESS_WHEN: never
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Verify CI environment
        run: |
          set -euo pipefail

          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Watch memory for trial
        run: |
          set +e

          cat >/run/memory-trial.sh <<'EOF'
          cg=$1
          min=
          max=0
          while :; do
            avail=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
            anon=$(awk '/^anon / { print $2 }' "$cg/memory.stat")
            if [ -z "$min" ] || [ "$avail" -lt "$min" ]; then
              min=$avail
              echo "MemAvailable minimum: $((min / 1024)) MiB at $(date -u +%T)" >/run/memory-trial-available
            fi
            if [ "$anon" -gt "$max" ]; then
              max=$anon
              echo "job anon peak: $((max / 1048576)) MiB at $(date -u +%T)" >/run/memory-trial-anon
            fi
            sleep 0.5
          done
          EOF
          systemd-run --collect --unit=memory-trial /bin/sh /run/memory-trial.sh \
            "/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
          exit 0

      - name: Check out
        run: |
          set -euo pipefail

          : "${CI_WORKSPACE:?}"
          rm -rf "$CI_WORKSPACE"
          mkdir -p "$CI_WORKSPACE"
          cd "$CI_WORKSPACE"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          if [ -n "${PR_NUMBER:-}" ]; then
            git fetch -q --depth 1 origin "refs/pull/${PR_NUMBER}/head"
          else
            git fetch -q --depth 1 origin "$FORGEJO_REF_NAME"
          fi
          git checkout -q FETCH_HEAD
          [ -z "${EXPECTED_SHA:-}" ] || [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] \
            || { echo "FATAL: PR head moved since approval (want $EXPECTED_SHA, got $(git rev-parse HEAD))"; exit 1; }
          git submodule update --init --recursive --quiet

      - name: Install JS dependencies
        run: cd "$CI_WORKSPACE" && bun install --frozen-lockfile --no-summary

      - name: Regenerate the credits and compare
        run: |
          set -euo pipefail

          cd "$CI_WORKSPACE"
          . ci/rust-env.sh
          bun run check:credits

      - name: Report the machine and peak memory
        if: always()
        run: |
          set +e

          cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
          systemctl stop memory-trial
          echo "nproc: $(nproc)"
          grep MemTotal /proc/meminfo
          lscpu | grep 'Model name'
          cat /run/memory-trial-available /run/memory-trial-anon
          peak=$(cat "$cg/memory.peak")
          echo "memory.peak, page cache included: ${peak} bytes ($(( ${peak:-0} / 1048576 )) MiB)"
          grep -E '^(anon|file|shmem|pgmajfault|workingset_refault_anon|workingset_refault_file) ' "$cg/memory.stat" | sed 's/^/memory.stat: /'
          sed 's/^/memory.events: /' "$cg/memory.events"
          sed 's/^/memory pressure: /' /proc/pressure/memory
          dmesg | grep -iE 'oom|out of memory'
          exit 0
