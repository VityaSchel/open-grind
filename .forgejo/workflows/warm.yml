name: warm

on:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - rust-toolchain.toml
      - .forgejo/workflows/warm.yml
  workflow_dispatch:

concurrency:
  group: open-grind-warm
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ["open-grind-orchestrator-d9bc00520038"]
    timeout-minutes: 15
    steps:
      - name: Provision the warm box
        env:
          TF_VAR_name: open-grind-warm-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_image: ${{ secrets.TF_VAR_CHECK_IMAGE }}
        run: bun /opt/ci/provision.ts warm

  warm:
    needs: provision
    runs-on: ["open-grind-warm"]
    timeout-minutes: 50
    steps:
      - name: Build the dependency graph from trusted code and publish the cache
        env:
          CI_WORKSPACE: /opt/open-grind-ci
          CI_CACHE: /opt/open-grind-cache
          RUSTUP_HOME: /opt/rust/rustup
          CARGO_TERM_PROGRESS_WHEN: never
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_BUCKET: ${{ secrets.CACHE_BUCKET }}
          CACHE_ACCESS_KEY: ${{ secrets.CACHE_RW_ACCESS_KEY }}
          CACHE_SECRET_KEY: ${{ secrets.CACHE_RW_SECRET_KEY }}
        run: |
          set -euo pipefail

          step() { printf '\n==> %s [%s]\n' "$*" "$(date -u +%T)" >&2; "$@"; }

          rm -rf "$CI_WORKSPACE" "$CI_CACHE"
          mkdir -p "$CI_WORKSPACE" "$CI_CACHE"
          cd "$CI_WORKSPACE"
          export CARGO_HOME="$CI_CACHE/cargo" CARGO_TARGET_DIR="$CI_CACHE/target"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q "$FORGEJO_SHA"
          git -c url."$FORGEJO_SERVER_URL/".insteadOf="ssh://git@git.opengrind.org/" \
            submodule update --init --recursive --quiet

          . ci/rust-env.sh

          step bun install --frozen-lockfile
          step bun run test:rust
          step bun run ci/cache.ts save

  teardown:
    needs: [provision, warm]
    if: always()
    runs-on: ["open-grind-orchestrator-d9bc00520038"]
    timeout-minutes: 15
    steps:
      - name: Destroy the warm box
        env:
          TF_VAR_name: open-grind-warm-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
        run: bun /opt/ci/teardown.ts warm
