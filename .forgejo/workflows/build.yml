name: build

on:
  workflow_dispatch: {}

concurrency:
  group: open-grind-build

jobs:
  provision:
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 20
    steps:
      - name: Register runners and provision builders
        env:
          OPEN_GRIND_FORGEJO_TOKEN: ${{ secrets.OPEN_GRIND_FORGEJO_TOKEN }}
          OPEN_GRIND_HETZNER_API_TOKEN: ${{ secrets.OPEN_GRIND_HETZNER_API_TOKEN }}
          OPEN_GRIND_HETZNER_SSH_KEY_IDS: ${{ secrets.OPEN_GRIND_HETZNER_SSH_KEY_IDS }}
          # OPEN_GRIND_DIGITALOCEAN_TOKEN: ${{ secrets.OPEN_GRIND_DIGITALOCEAN_TOKEN }}
          # OPEN_GRIND_DIGITALOCEAN_SSH_KEY_IDS: ${{ secrets.OPEN_GRIND_DIGITALOCEAN_SSH_KEY_IDS }}
          OPEN_GRIND_HETZNER_PLANS: ${{ vars.OPEN_GRIND_HETZNER_PLANS }}
          OPEN_GRIND_HETZNER_LOCATIONS: ${{ vars.OPEN_GRIND_HETZNER_LOCATIONS }}
          # OPEN_GRIND_DIGITALOCEAN_SIZE: ${{ vars.OPEN_GRIND_DIGITALOCEAN_SIZE }}
          # OPEN_GRIND_DIGITALOCEAN_REGIONS: ${{ vars.OPEN_GRIND_DIGITALOCEAN_REGIONS }}
          # OPEN_GRIND_CHERRY_API_TOKEN: ${{ secrets.OPEN_GRIND_CHERRY_API_TOKEN }}
          # OPEN_GRIND_CHERRY_PROJECT_ID: ${{ secrets.OPEN_GRIND_CHERRY_PROJECT_ID }}
          # OPEN_GRIND_CHERRY_SSH_KEY_IDS: ${{ secrets.OPEN_GRIND_CHERRY_SSH_KEY_IDS }}
          # OPEN_GRIND_VULTR_API_KEY: ${{ secrets.OPEN_GRIND_VULTR_API_KEY }}
          # OPEN_GRIND_VULTR_SSH_KEY_IDS: ${{ secrets.OPEN_GRIND_VULTR_SSH_KEY_IDS }}
          # OPEN_GRIND_SCALEWAY_ACCESS_KEY: ${{ secrets.OPEN_GRIND_SCALEWAY_ACCESS_KEY }}
          # OPEN_GRIND_SCALEWAY_SECRET_KEY: ${{ secrets.OPEN_GRIND_SCALEWAY_SECRET_KEY }}
          # OPEN_GRIND_SCALEWAY_PROJECT_ID: ${{ secrets.OPEN_GRIND_SCALEWAY_PROJECT_ID }}
        run: bash /opt/open-grind/provision.sh

  build:
    needs: provision
    strategy:
      fail-fast: false
      matrix:
        # box: [a, b, c, d, e]  enable a provider by adding its box letter
        box: [c]
    runs-on: ["open-grind-builder-${{ matrix.box }}"]
    timeout-minutes: 90
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q FETCH_HEAD
      - name: Build
        run: |
          docker compose --ansi never --progress plain build
          docker compose --ansi never --progress plain run --rm -T build
      - name: Collect APK
        run: |
          apk=(src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          [ ${#apk[@]} -eq 1 ]
          mkdir -p out
          cp "${apk[0]}" out/
      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned-${{ matrix.box }}
          path: out/
          retention-days: 1

  verify:
    needs: build
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 15
    steps:
      - name: Download builds
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: dl
      - name: Compare
        run: |
          apks=(dl/*/*.apk)
          [ ${#apks[@]} -eq 1 ] # one per active box
          sha256sum "${apks[@]}"
          for apk in "${apks[@]:1}"; do cmp "${apks[0]}" "$apk"; done
          mkdir -p verified
          cp "${apks[0]}" verified/open-grind-unsigned.apk
      - name: Publish verified artifact
        uses: https://code.forgejo.org/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: open-grind-unsigned
          path: verified/open-grind-unsigned.apk
          archive: false

  teardown:
    needs: [provision, build, verify]
    if: always()
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 20
    steps:
      - name: Delete builders
        env:
          OPEN_GRIND_FORGEJO_TOKEN: ${{ secrets.OPEN_GRIND_FORGEJO_TOKEN }}
          OPEN_GRIND_HETZNER_API_TOKEN: ${{ secrets.OPEN_GRIND_HETZNER_API_TOKEN }}
          # OPEN_GRIND_DIGITALOCEAN_TOKEN: ${{ secrets.OPEN_GRIND_DIGITALOCEAN_TOKEN }}
          # OPEN_GRIND_CHERRY_API_TOKEN: ${{ secrets.OPEN_GRIND_CHERRY_API_TOKEN }}
          # OPEN_GRIND_CHERRY_PROJECT_ID: ${{ secrets.OPEN_GRIND_CHERRY_PROJECT_ID }}
          # OPEN_GRIND_VULTR_API_KEY: ${{ secrets.OPEN_GRIND_VULTR_API_KEY }}
          # OPEN_GRIND_SCALEWAY_SECRET_KEY: ${{ secrets.OPEN_GRIND_SCALEWAY_SECRET_KEY }}
          # OPEN_GRIND_SCALEWAY_PROJECT_ID: ${{ secrets.OPEN_GRIND_SCALEWAY_PROJECT_ID }}
        run: bash /opt/open-grind/teardown.sh
