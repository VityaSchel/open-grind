name: build

on:
  workflow_dispatch: {}

concurrency:
  group: open-grind-build

jobs:
  provision:
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 15
    outputs:
      boxes: ${{ steps.provision.outputs.boxes }}
    steps:
      - name: Provision builders
        id: provision
        env:
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_cherry_token: ${{ secrets.TF_VAR_CHERRY_TOKEN }}
          TF_VAR_cherry_project_id: ${{ secrets.TF_VAR_CHERRY_PROJECT_ID }}
          TF_VAR_vultr_token: ${{ secrets.TF_VAR_VULTR_TOKEN }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_scaleway_access_key: ${{ secrets.TF_VAR_SCALEWAY_ACCESS_KEY }}
          TF_VAR_scaleway_secret_key: ${{ secrets.TF_VAR_SCALEWAY_SECRET_KEY }}
          TF_VAR_scaleway_project_id: ${{ secrets.TF_VAR_SCALEWAY_PROJECT_ID }}
          TF_VAR_digitalocean_token: ${{ secrets.TF_VAR_DIGITALOCEAN_TOKEN }}
        run: bun /opt/ci/provision.ts build

  build:
    needs: provision
    strategy:
      fail-fast: false
      matrix:
        box: ${{ fromJson(needs.provision.outputs.boxes) }}
    runs-on: ["${{ matrix.box }}"]
    timeout-minutes: 45
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q "$FORGEJO_SHA"
      - name: Build
        run: |
          docker compose --ansi never --progress plain build
          docker compose --ansi never --progress plain run --rm -T build
      - name: Collect APK
        run: |
          apk=(src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          [ ${#apk[@]} -eq 1 ]
          mkdir -p out
          cp "${apk[0]}" out/
      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned-${{ matrix.box }}
          path: out/
          retention-days: 1

  verify:
    needs: [provision, build]
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 10
    steps:
      - name: Download builds
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: dl
      - name: Compare
        run: bun /opt/ci/verify.ts dl verified
      - name: Publish verified artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned
          path: verified/open-grind-unsigned.apk

  teardown:
    needs: [provision, build, verify]
    if: always()
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 15
    steps:
      - name: Destroy builders
        env:
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_cherry_token: ${{ secrets.TF_VAR_CHERRY_TOKEN }}
          TF_VAR_cherry_project_id: ${{ secrets.TF_VAR_CHERRY_PROJECT_ID }}
          TF_VAR_vultr_token: ${{ secrets.TF_VAR_VULTR_TOKEN }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_scaleway_access_key: ${{ secrets.TF_VAR_SCALEWAY_ACCESS_KEY }}
          TF_VAR_scaleway_secret_key: ${{ secrets.TF_VAR_SCALEWAY_SECRET_KEY }}
          TF_VAR_scaleway_project_id: ${{ secrets.TF_VAR_SCALEWAY_PROJECT_ID }}
          TF_VAR_digitalocean_token: ${{ secrets.TF_VAR_DIGITALOCEAN_TOKEN }}
        run: bun /opt/ci/teardown.ts build
