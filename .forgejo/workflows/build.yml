name: build

on:
  workflow_dispatch:
    inputs:
      cherry:
        description: open-grind-builder-1-cherry
        type: boolean
        default: true
      vultr:
        description: open-grind-builder-2-vultr
        type: boolean
        default: true
      hetzner:
        description: open-grind-builder-3-hetzner
        type: boolean
        default: true

concurrency:
  group: open-grind-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 5
    outputs:
      boxes: ${{ steps.plan.outputs.boxes }}
    steps:
      - name: Resolve the builder set
        id: plan
        env:
          BOXES: ${{ inputs.cherry && 'cherry' || '' }} ${{ inputs.vultr && 'vultr' || '' }} ${{ inputs.hetzner && 'hetzner' || '' }}
        run: bun /opt/ci/provision.ts names

  provision:
    needs: plan
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 30
    steps:
      - name: Provision builders
        env:
          BOXES: ${{ inputs.cherry && 'cherry' || '' }} ${{ inputs.vultr && 'vultr' || '' }} ${{ inputs.hetzner && 'hetzner' || '' }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_cherry_token: ${{ secrets.TF_VAR_CHERRY_TOKEN }}
          TF_VAR_cherry_project_id: ${{ secrets.TF_VAR_CHERRY_PROJECT_ID }}
          TF_VAR_vultr_token: ${{ secrets.TF_VAR_VULTR_TOKEN }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_scaleway_access_key: ${{ secrets.TF_VAR_SCALEWAY_ACCESS_KEY }}
          TF_VAR_scaleway_secret_key: ${{ secrets.TF_VAR_SCALEWAY_SECRET_KEY }}
          TF_VAR_scaleway_project_id: ${{ secrets.TF_VAR_SCALEWAY_PROJECT_ID }}
          TF_VAR_digitalocean_token: ${{ secrets.TF_VAR_DIGITALOCEAN_TOKEN }}
        run: bun /opt/ci/provision.ts build

  build:
    needs: [plan, provision]
    if: ${{ needs.provision.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        box: ${{ fromJson(needs.plan.outputs.boxes) }}
    runs-on: ["${{ matrix.box }}"]
    timeout-minutes: 45
    env:
      BUILD_ROOT: /work
      HOME: /root
      CARGO_HOME: /root/.cargo
      OPEN_GRIND_GRADLE_USER_HOME: /root/.gradle-opengrind
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Checkout
        run: |
          : "${BUILD_ROOT:?}"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q "$FORGEJO_SHA"
          git -c url."$FORGEJO_SERVER_URL/".insteadOf="ssh://git@git.opengrind.org/" \
            submodule update --init --recursive
      - name: Refuse a development version
        run: |
          cd "${BUILD_ROOT:?}"
          version=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          echo "version: $version"
          case "$version" in
            "") echo "could not read version from src-tauri/tauri.conf.json"; exit 1 ;;
            *-dev*) echo "refusing to build a development version; set the release version first"; exit 1 ;;
          esac
      - name: Build
        run: cd "${BUILD_ROOT:?}" && nix run .#build-android
      - name: Collect APK
        run: |
          : "${BUILD_ROOT:?}"
          apk=("$BUILD_ROOT"/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          [ ${#apk[@]} -eq 1 ]
          mkdir -p out
          cp "${apk[0]}" out/
      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned-${{ matrix.box }}
          path: out/
          retention-days: 1

  verify:
    needs: [plan, provision, build]
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 10
    env:
      BOXES: ${{ needs.plan.outputs.boxes }}
    steps:
      - name: Download builds
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: dl
      - name: Compare
        run: bun /opt/ci/verify.ts dl verified
      - name: Publish verified artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned
          path: verified/

  teardown:
    needs: [plan, provision, build, verify]
    if: always()
    runs-on: ["open-grind-orchestrator"]
    timeout-minutes: 15
    steps:
      - name: Destroy builders
        env:
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_cherry_token: ${{ secrets.TF_VAR_CHERRY_TOKEN }}
          TF_VAR_cherry_project_id: ${{ secrets.TF_VAR_CHERRY_PROJECT_ID }}
          TF_VAR_vultr_token: ${{ secrets.TF_VAR_VULTR_TOKEN }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_scaleway_access_key: ${{ secrets.TF_VAR_SCALEWAY_ACCESS_KEY }}
          TF_VAR_scaleway_secret_key: ${{ secrets.TF_VAR_SCALEWAY_SECRET_KEY }}
          TF_VAR_scaleway_project_id: ${{ secrets.TF_VAR_SCALEWAY_PROJECT_ID }}
          TF_VAR_digitalocean_token: ${{ secrets.TF_VAR_DIGITALOCEAN_TOKEN }}
        run: bun /opt/ci/teardown.ts build
