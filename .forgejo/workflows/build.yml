name: build

on:
  workflow_dispatch:
    inputs:
      providers:
        description: builders to compare
        type: choice
        default: all
        options: [all, cherry, vultr, hetzner]
      allow_dev:
        description: allow a -dev version (test build, never release the artifact)
        type: boolean
        default: false

concurrency:
  group: open-grind-build
  cancel-in-progress: false

env:
  BOXES: >-
    ${{ inputs.providers == 'all' && '["cherry","vultr","hetzner"]'
    || format('["{0}"]', inputs.providers) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        provider: >-
          ${{ fromJson(inputs.providers == 'all' && '["cherry","vultr","hetzner"]'
          || format('["{0}"]', inputs.providers)) }}
    runs-on: ["build", "${{ matrix.provider }}"]
    timeout-minutes: 55
    env:
      BUILD_ROOT: /work
      HOME: /root
      CARGO_HOME: /root/.cargo
      OPEN_GRIND_GRADLE_USER_HOME: /root/.gradle-opengrind
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Checkout
        run: |
          : "${BUILD_ROOT:?}"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q "$FORGEJO_SHA"
          git -c url."$FORGEJO_SERVER_URL/".insteadOf="ssh://git@git.opengrind.org/" \
            submodule update --init --recursive
      - name: Check the version
        env:
          ALLOW_DEV: ${{ inputs.allow_dev }}
        run: cd "${BUILD_ROOT:?}" && sh ci/check-release-version.sh
      - name: Set up the build environment
        run: cd "${BUILD_ROOT:?}" && sh ci/setup-build.sh
      - name: Build
        run: cd "${BUILD_ROOT:?}" && nix run .#build-android
      - name: Collect APK
        run: |
          : "${BUILD_ROOT:?}"
          apk=("$BUILD_ROOT"/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          [ ${#apk[@]} -eq 1 ]
          mkdir -p out
          cp "${apk[0]}" out/
      - name: Android unit tests
        run: |
          cd "${BUILD_ROOT:?}"
          GRADLE_USER_HOME="${OPEN_GRIND_GRADLE_USER_HOME:?}" \
            nix develop .#android --command bun run test:android
      - name: Android logic unit tests
        run: |
          cd "${BUILD_ROOT:?}"
          GRADLE_USER_HOME="${OPEN_GRIND_GRADLE_USER_HOME:?}" \
            nix develop .#android --command bun run test:android-logic
      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned-${{ matrix.provider }}
          path: out/
          retention-days: 1

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        provider: >-
          ${{ fromJson(inputs.providers == 'all' && '["cherry","vultr","hetzner"]'
          || format('["{0}"]', inputs.providers)) }}
    runs-on: ["build", "${{ matrix.provider }}"]
    timeout-minutes: 45
    env:
      BUILD_ROOT: /work-linux
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Checkout
        run: |
          : "${BUILD_ROOT:?}"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q "$FORGEJO_SHA"
          git -c url."$FORGEJO_SERVER_URL/".insteadOf="ssh://git@git.opengrind.org/" \
            submodule update --init --recursive
      - name: Check the version
        env:
          ALLOW_DEV: ${{ inputs.allow_dev }}
        run: cd "${BUILD_ROOT:?}" && sh ci/check-release-version.sh
      - name: Set up the build environment
        run: cd "${BUILD_ROOT:?}" && sh ci/setup-build.sh
      - name: Build
        run: |
          cd "${BUILD_ROOT:?}"
          podman build -t open-grind-linux ci/linux
          podman run --rm -v "$BUILD_ROOT:/work" open-grind-linux sh ci/linux/build.sh
      - name: Collect .deb
        run: |
          : "${BUILD_ROOT:?}"
          deb=("$BUILD_ROOT"/src-tauri/target/release/bundle/deb/*.deb)
          [ ${#deb[@]} -eq 1 ]
          mkdir -p out
          cp "${deb[0]}" out/
      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned-linux-${{ matrix.provider }}
          path: out/
          retention-days: 1

  verify:
    needs: [build, build-linux]
    runs-on: ["verify", "hetzner"]
    timeout-minutes: 10
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF_NAME"
          git checkout -q "$FORGEJO_SHA"
      - name: Download builds
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: dl
      - name: Compare
        run: bun ci/verify.ts dl verified
      - name: Publish verified artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: open-grind-unsigned
          path: verified/
