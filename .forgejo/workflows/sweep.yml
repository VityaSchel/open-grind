name: sweep

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: destroy state older than this many minutes; empty = box lifetime, 0 = everything (only when no runs are active)
        type: string
        default: ""

concurrency:
  group: open-grind-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on:
      [
        "open-grind-orchestrator-bf303cca9cfaf8c4cd5fbdc1a66428e7a35fda8e755286ba663e53374a47e062",
      ]
    timeout-minutes: 20
    steps:
      - name: Destroy boxes past their lifetime
        env:
          SWEEP_MINUTES: ${{ inputs.minutes }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_cherry_token: ${{ secrets.TF_VAR_CHERRY_TOKEN }}
          TF_VAR_cherry_project_id: ${{ secrets.TF_VAR_CHERRY_PROJECT_ID }}
          TF_VAR_vultr_token: ${{ secrets.TF_VAR_VULTR_TOKEN }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_scaleway_access_key: ${{ secrets.TF_VAR_SCALEWAY_ACCESS_KEY }}
          TF_VAR_scaleway_secret_key: ${{ secrets.TF_VAR_SCALEWAY_SECRET_KEY }}
          TF_VAR_scaleway_project_id: ${{ secrets.TF_VAR_SCALEWAY_PROJECT_ID }}
          TF_VAR_digitalocean_token: ${{ secrets.TF_VAR_DIGITALOCEAN_TOKEN }}
        run: bun /opt/ci/teardown.ts sweep
