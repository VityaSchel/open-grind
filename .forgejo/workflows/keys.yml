name: keys

on:
  push:
    branches: [main]
    paths:
      - KEYS.md
      - KEYS.md.asc
      - .forgejo/workflows/keys.yml
  workflow_dispatch: {}

concurrency:
  group: open-grind-keys
  cancel-in-progress: false

jobs:
  verify:
    runs-on:
      [
        "open-grind-orchestrator-bf303cca9cfaf8c4cd5fbdc1a66428e7a35fda8e755286ba663e53374a47e062",
      ]
    timeout-minutes: 5
    steps:
      - name: Verify the KEYS.md signature
        run: bun /opt/ci/verify-keys.ts
