name: keys

on:
  push:
    branches: [main]
    paths:
      - KEYS.md
      - KEYS.md.asc
      - .forgejo/workflows/keys.yml
  workflow_dispatch: {}

concurrency:
  group: open-grind-keys
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ["open-grind-orchestrator-d9bc00520038"]
    timeout-minutes: 5
    steps:
      - name: Verify the KEYS.md signature
        run: bun /opt/ci/verify-keys.ts
