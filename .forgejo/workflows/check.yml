name: check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check
        type: string
        required: true

concurrency:
  group: open-grind-check
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ["open-grind-orchestrator-d9bc00520038"]
    timeout-minutes: 15
    steps:
      - name: Provision the check box
        env:
          TF_VAR_name: open-grind-check-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
          TF_VAR_image: ${{ secrets.TF_VAR_CHECK_IMAGE }}
        run: bun /opt/ci/provision.ts check

  check:
    needs: provision
    runs-on: ["open-grind-check"]
    timeout-minutes: 60
    steps:
      - name: Check the pull request head in a credential-free environment
        env:
          GITHUB_TOKEN: ""
          FORGEJO_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          PR_NUMBER: ${{ forgejo.event.pull_request.number || inputs.pr }}
          EXPECTED_SHA: ${{ forgejo.event.pull_request.head.sha }}
          CI_WORKSPACE: /opt/open-grind-ci
          CI_CACHE: /opt/open-grind-cache
          RUSTUP_HOME: /opt/rust/rustup
          CARGO_TERM_PROGRESS_WHEN: never
          NODE_OPTIONS: --max-old-space-size=6144
          ESLINT_PROGRESS: "1"
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_BUCKET: ${{ secrets.CACHE_BUCKET }}
          CACHE_ACCESS_KEY: ${{ secrets.CACHE_RO_ACCESS_KEY }}
          CACHE_SECRET_KEY: ${{ secrets.CACHE_RO_SECRET_KEY }}
        run: |
          set -euo pipefail

          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' \
            | grep -vE '^CACHE_(ACCESS_KEY|SECRET_KEY)=' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

          step() { printf '\n==> %s [%s]\n' "$*" "$(date -u +%T)" >&2; "$@"; }

          rm -rf "$CI_WORKSPACE"
          mkdir -p "$CI_WORKSPACE" "$CI_CACHE"
          cd "$CI_WORKSPACE"
          export CARGO_HOME="$CI_CACHE/cargo" CARGO_TARGET_DIR="$CI_CACHE/target"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "refs/pull/${PR_NUMBER}/head"
          git checkout -q FETCH_HEAD
          [ -z "$EXPECTED_SHA" ] || [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] \
            || { echo "FATAL: PR head moved since approval (want $EXPECTED_SHA, got $(git rev-parse HEAD))"; exit 1; }
          git -c url."$FORGEJO_SERVER_URL/".insteadOf="ssh://git@git.opengrind.org/" \
            submodule update --init --recursive --quiet

          . ci/rust-env.sh

          step bun run ci/cache.ts restore
          echo "cargo home: $(ls "$CARGO_HOME" 2>/dev/null | tr '\n' ' ')| free: $(df -h --output=avail "$CI_CACHE" | tail -1)" >&2

          step cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null

          step bun install --frozen-lockfile
          step bun run check:version
          step bun run lint
          step bun run check
          step bun run test:unit
          step bun run test:rust

  teardown:
    needs: [provision, check]
    if: always()
    runs-on: ["open-grind-orchestrator-d9bc00520038"]
    timeout-minutes: 15
    steps:
      - name: Destroy the check box
        env:
          TF_VAR_name: open-grind-check-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_hetzner_token: ${{ secrets.TF_VAR_HETZNER_TOKEN }}
        run: bun /opt/ci/teardown.ts check
