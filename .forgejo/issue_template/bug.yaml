name: Bug Report
about: Something is broken
title: ""
ref: "main"
labels:
  - bug
  - app
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a bug, please [search](https://git.opengrind.org/open-grind/open-grind/issues) existing issues!
        There is a good chance it has already been reported and being worked on. If that's the case, please give the existing issue a 👍 or add a comment instead of creating a new one.

        **Known issues:**
        - [Cloudflare blocking requests](https://git.opengrind.org/open-grind/open-grind/issues/81)
        - ["Can't connect to Grindr"](https://git.opengrind.org/open-grind/open-grind/issues/198)

        **Do NOT put "Something went wrong" in the title**, instead paste redacted error details and describe what happened.
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      placeholder: Include step-by-step instructions to reproduce the bug, and a description of what you expected to happen instead.
      value: ""
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Details copied from the error
      description: Please copy and paste any relevant log output. **Redact any personal information manually**, that includes messages text, names, links.
      render: json
  - type: input
    id: version
    attributes:
      label: Version of Open Grind
      description: You can find this in the app's settings. Put "N/A" only if version is not applicable.
      placeholder: e.g. v0.1.0-beta.4.1
  - type: checkboxes
    id: existing-issues-searcehd
    visible: [form]
    attributes:
      label: Existing issues searched
      description: By submitting this issue, you confirm you have [searched existing issues](https://git.opengrind.org/open-grind/open-grind/issues). Not only by querying search but also [viewing latest closed issues](https://git.opengrind.org/open-grind/open-grind/issues?q=&type=all&sort=relevance&state=closed&labels=&milestone=0&project=0&assignee=0&poster=0&archived=false).
      options:
        - label: I have checked that this is a new issue that wasn't reported before.
          required: true
