name: Bug Report
about: Something is broken
title: ""
ref: "main"
labels:
  - bug
  - app
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a bug, please [search](https://git.opengrind.org/open-grind/open-grind/issues) existing issues!
        There is a good chance it has already been reported and being worked on. If that's the case, please give the existing issue a 👍 or add a comment instead of creating a new one.

        Known issues:
        - ["Incorrect password" error when trying to log in](https://git.opengrind.org/open-grind/open-grind/issues/83)
        - ["Version deprecated" error](https://git.opengrind.org/open-grind/open-grind/issues/119)
        - [Cloudflare blocking requests](https://git.opengrind.org/open-grind/open-grind/issues/81)

        **Do NOT put "Something went wrong" in the title**, instead copy details, **redact them manually** and describe what happened.
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      placeholder: Include step-by-step instructions to reproduce the bug, and a description of what you expected to happen instead.
      value: ""
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Details copied from the error
      description: Please copy and paste any relevant log output. **Redact any personal information manually**, that includes messages text, names, links.
      render: json
  - type: input
    id: version
    attributes:
      label: Version of Open Grind
      description: You can find this in the app's settings. Put "N/A" only if version is not applicable.
      placeholder: e.g. v0.1.0-beta.2
