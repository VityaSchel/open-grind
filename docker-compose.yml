# Result: src-tauri/gen/android/app/build/outputs/apk/universal/release/
services:
  build:
    platform: linux/amd64
    build:
      context: .
    image: open-grind-build
    init: true
    working_dir: /work
    volumes:
      - .:/work
      - open-grind-nix:/nix
      - open-grind-cargo-target:/work/src-tauri/target  # Rust build artifacts
      - open-grind-node-modules:/work/node_modules      # bun dependencies
      - open-grind-cargo-home:/root/.cargo              # crate registry, git deps
      - open-grind-gradle:/root/.gradle-opengrind       # Gradle dist, caches (build-android's GRADLE_USER_HOME)
      - open-grind-bun:/root/.bun                       # bun download cache
    command: ["nix", "run", ".#build-android"]

volumes:
  open-grind-nix:
  open-grind-cargo-target:
  open-grind-node-modules:
  open-grind-cargo-home:
  open-grind-gradle:
  open-grind-bun:
